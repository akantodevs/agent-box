name: Semver Tag latest

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  tag:
    runs-on: ubuntu-latest

    permissions:
      packages: write

    strategy:
      matrix:
        image:
          - agent-box

    steps:
      - name: Set variables
        id: vars
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}"
          SEMVER="${GITHUB_REF_NAME}"

          echo "IMAGE=$IMAGE" >> $GITHUB_OUTPUT
          echo "SEMVER=$SEMVER" >> $GITHUB_OUTPUT

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure tag does not exist
        run: |
          if docker buildx imagetools inspect \
             ${{ steps.vars.outputs.IMAGE }}:${{ steps.vars.outputs.SEMVER }} > /dev/null 2>&1; then
            echo "ERROR: tag already exists"
            exit 1
          fi

      - name: Promote latest → semver
        run: |
          docker buildx imagetools create \
            -t ${{ steps.vars.outputs.IMAGE }}:${{ steps.vars.outputs.SEMVER }} \
            ${{ steps.vars.outputs.IMAGE }}:latest
