name: Publish agent-box image

# Builds the agent-box image and pushes it to GitHub Container Registry, so
# other projects can pull ghcr.io/<owner>/agent-box instead of building from
# a local checkout of this repo.
on:
  push:
    branches: [main]
    paths:
      - "agent-box/**"
      - ".github/workflows/publish-agent-box.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Emulates arm64 on the amd64 runner so one job can build both
      # architectures into a single multi-arch manifest.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generates tags ("latest" on the default branch + the commit sha for
      # pinning/rollback) and OCI labels, including the
      # org.opencontainers.image.source label that links the ghcr package to
      # this repository.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/agent-box
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      # Resolve the newest published CLI and bake that exact version in. The
      # Dockerfile could say `@latest` itself, but the install layer is cached
      # on its command text alone: with `type=gha` below, an unchanging command
      # is a cache hit on every run, and the image would keep shipping whatever
      # CLI version was current when the layer was first cached. Substituting
      # the resolved number makes a new release — and only a new release —
      # invalidate the layer.
      - name: Resolve latest Claude Code version
        id: cli
        run: |
          version="$(npm view @anthropic-ai/claude-code version)"
          echo "Building with Claude Code $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # amd64 for Linux/Windows hosts, arm64 for Apple Silicon Macs (and arm
      # Linux servers). Docker pulls the matching variant automatically.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: agent-box
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            CLAUDE_CODE_VERSION=${{ steps.cli.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
