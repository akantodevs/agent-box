name: Publish agent-box image

# Builds the agent-box image and pushes it to GitHub Container Registry, so
# other projects can pull ghcr.io/<owner>/agent-box instead of building from
# a local checkout of this repo.
on:
  push:
    branches: [main]
    paths:
      - "agent-box/**"
      - ".github/workflows/publish-agent-box.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generates tags ("latest" on the default branch + the commit sha for
      # pinning/rollback) and OCI labels, including the
      # org.opencontainers.image.source label that links the ghcr package to
      # this repository.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/agent-box
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      # linux/amd64 only: the Dockerfile hardcodes the ttyd.x86_64 binary, so
      # an arm64 image would not work without changes there first.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: agent-box
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
