name: agent-box

services:
  agent:
    build:
      context: agent-box
      dockerfile: Dockerfile
    # Pin the built image name/tag. Without this, Compose auto-names it
    # "<project>-<service>" (i.e. "agent-box-agent"), which is confusing next to
    # the "agent-box" container name.
    image: agent-box:latest
    container_name: agent-box-dev
    init: true
    ports:
      - 8095:8090 # session list (admin page)
      - 8096:8091 # Agent tabs

    environment:
      # What this box is called, in browser tabs: the session administration
      # page is titled "Sessions: <name>", and every session tab ends in it —
      # which is how you tell two agent-boxes apart. Leave it out and the
      # container's own name is used (falling back to the hostname).
      AGENT_NAME: "agent-box-dev"

      # TTYD credential (also guards the session administration page)
      TTYD_USER: "admin"
      TTYD_PASSWORD: "admin"

      # If you change default ports, please provide them here
      SESSION_LIST_PUBLIC_PORT: 8095
      AGENT_TABS_PUBLIC_PORT: 8096

      # Set model Claude Code launches with (sonnet/opus/fable/..)
      CLAUDE_MODEL: "opus"

      # Controls whether the agent may run infrastructure-mutating Terraform
      # (apply/destroy/import/state rm|mv/taint/...). Read-only commands (plan,
      # validate, show, ...) always run.
      #   No   - blocked outright
      #   Ask  - prompt once per terraform directory, then remember that dir
      #          (so approving stage/ doesn't auto-approve prod/)
      #   Yes  - run without asking
      # If unset/unrecognized the guard fails closed (blocks). Per-directory Ask
      # approvals persist in /home/claude/.claude/terraform-approvals.json.
      ALLOW_TERRAFORM_MODIFY: "Ask"

      # Base name for Claude Code Remote Control. Each session appends its own
      # suffix (slugified session title, or the head of its id), so concurrent
      # sessions stay distinguishable. Leave unset/commented to keep Remote
      # Control off (the default).
      REMOTE_CONTROL_NAME: "agent-box-dev"

      # Uncomment to disable the Playwright browser-automation plugin,
      # e.g. when using agent-box for something other than web development.
      # DISABLE_PLAYWRIGHT: "true"

    volumes:
      # We must mount docker socket to allow the agent to run docker commands on the host
      - /var/run/docker.sock:/var/run/docker.sock

      # We mount the current directory to /workspace in the container, so that the agent can perform development on itself
      # For projects that uses the agent container, the codebase will be mounted here instead
      - ./:/workspace:z

      # Persist Claude Code state (credentials, session transcripts, settings) across container rebuilds.
      # On first startup the user authenticates via OAuth; credentials are then stored in this volume.
      - claude-data:/home/claude/.claude

volumes:
  claude-data:
