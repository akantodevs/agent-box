name: agent-box

services:
  agent:
    build:
      context: agent-box
      dockerfile: Dockerfile
    # Pin the built image name/tag. Without this, Compose auto-names it
    # "<project>-<service>" (i.e. "agent-box-agent"), which is confusing next to
    # the "agent-box" container name.
    image: agent-box:latest
    container_name: agent-box
    init: true

    ports:
      - 7681:7681 # Port for ttyd web terminal

    environment:
      # TTYD credential
      TTYD_USER: "admin"
      TTYD_PASSWORD: "admin"

      # Set model Claude Code launches with (sonnet/opus/fable/..)
      CLAUDE_MODEL: "fable"

      # Uncomment to disable the Playwright browser-automation plugin,
      # e.g. when using agent-box for something other than web development.
      # DISABLE_PLAYWRIGHT: "true"

    volumes:
      # We must mount docker socket to allow the agent to run docker commands on the host
      - /var/run/docker.sock:/var/run/docker.sock

      # We mount the current directory to /repo in the container, so that the agent can perform development on itself
      # For projects that uses the agent container, the codebase will be mounted here instead
      - ./:/repo:z

      # Persist Claude Code state (credentials, session transcripts, settings) across container rebuilds.
      # On first startup the user authenticates via OAuth; credentials are then stored in this volume.
      - claude-data:/home/claude/.claude

volumes:
  claude-data:
